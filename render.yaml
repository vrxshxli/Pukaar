# Render blueprint: one web service built from the Dockerfile.
# In Render: New + > Blueprint > pick this repo. You will be asked for the two passwords.
services:
  - type: web
    name: pukaar
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_MODE
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PLANNER_SCOPE
        value: judgment
      - key: PUKAAR_OFFICER_PASSWORD
        sync: false
      - key: PUKAAR_VOLUNTEER_PASSWORD
        sync: false
